<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ٹینک لیول - Channel 3010841</title>
<style>
    body {
        font-family: 'Segoe UI', Arial;
        background: #eef5ff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .container {
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        text-align: center;
        width: 340px;
    }
    h2 { color: #0077b6; margin-bottom: 5px; }
    .channel { color: #777; font-size: 12px; margin-bottom: 15px; }
    .tank {
        width: 160px;
        height: 320px;
        border: 5px solid #0077b6;
        border-radius: 15px 15px 25px 25px;
        margin: 20px auto;
        position: relative;
        background: #f0f0f0;
        overflow: hidden;
    }
    .water {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: linear-gradient(to top, #0096c7, #48cae4);
        transition: height 1.2s ease;
    }
    .percent {
        font-size: 32px;
        font-weight: bold;
        color: #023e7d;
        margin-top: 10px;
    }
    .status { font-size: 15px; color: #555; font-weight: 500; }
    .raw { font-size: 12px; color: #888; margin-top: 5px; }
</style>
</head>
<body>
<div class="container">
    <h2>ٹینک لیول مانیٹر</h2>
    <div class="channel">Channel: 3010841 | Field: 5</div>

    <div class="tank">
        <div class="water" id="waterLevel"></div>
    </div>
    <div class="percent" id="percent">0%</div>
    <div class="status" id="status">ڈیٹا لوڈ ہو رہا ہے...</div>
    <div class="raw" id="rawValue"></div>
</div>

<script>
const CHANNEL_ID = "3010841";
const READ_API_KEY = "I4AJDEJIXTPAUIFK";
const FIELD = "field5";

// یہاں ٹینک کی Min اور Max ویلیو سیٹ کریں
// مثال: اگر سینسر 0 پر خالی اور 1000 پر فل ہے تو یہاں لکھ دیں
const MIN_VALUE = 130;      
const MAX_VALUE = 180;   

async function getData() {
    try {
        // ThingSpeak سے آخری ڈیٹا لینا
        let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/fields/${FIELD}/last.json?api_key=${READ_API_KEY}`;
        
        let response = await fetch(url);
        let data = await response.json();
        
        let sensorValue = parseFloat(data.field5);
        
        if(isNaN(sensorValue)) {
            document.getElementById("status").innerText = "کوئی ڈیٹا نہیں ملا";
            return;
        }

        // فیصد نکالیں
        let percent = ((sensorValue - MIN_VALUE) / (MAX_VALUE - MIN_VALUE)) * 100;
        percent = Math.max(0, Math.min(100, percent)); // 0 سے 100 کے درمیان

        // ٹینک اپڈیٹ کریں
        document.getElementById("waterLevel").style.height = percent + "%";
        document.getElementById("percent").innerText = percent.toFixed(1) + "%";
        document.getElementById("rawValue").innerText = "Raw Value: " + sensorValue;

        // سٹیٹس
        let statusText = "خالی";
        if(percent > 80) statusText = "مکمل بھرا ہوا ✅";
        else if(percent > 60) statusText = "بہت اچھا";
        else if(percent > 40) statusText = "آدھا بھرا";
        else if(percent > 20) statusText = "کم ہے ⚠️";
        else statusText = "بہت کم ہے! 🔴";
        
        document.getElementById("status").innerText = statusText;

    } catch(error) {
        console.log(error);
        document.getElementById("status").innerText = "کنکشن میں مسئلہ ہے";
    }
}

// ہر 5 سیکنڈ بعد اپڈیٹ
setInterval(getData, 5000);
getData(); // پہلی بار فوراً چلائیں
</script>
</body>
</html>
