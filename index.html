<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏠 Home Water Tank Level Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #0066cc;
        }

        .data-box {
            background: white;
            padding: 20px;
            margin: 15px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            max-width: 500px;
        }

        .label {
            font-weight: bold;
        }

        .tank {
            position: relative;
            width: 150px;
            height: 300px;
            margin: 20px auto;
            border: 3px solid #333;
            border-radius: 10px;
            background-color: #e6e6e6;
            overflow: hidden;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #00aaff;
            transition: height 1s;
        }

        .percentage {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .updated {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <h1>🏠 Home Water Tank Monitor</h1>

    <div class="data-box">
        <div><span class="label">Pressure:</span> <span id="pressure">--</span> mbar</div>
        <div><span class="label">Water Height:</span> <span id="height">--</span> in</div>
        <div><span class="label">Water Volume:</span> <span id="volume">--</span> Ltr</div>
        <div><span class="label">Fill Percentage:</span> <span id="fill">--</span> %</div>
        <div class="updated" id="timestamp">Last updated: --</div>
    </div>

    <div class="tank">
        <div class="water" id="water-level" style="height: 0%;"></div>
    </div>

    <div class="percentage" id="percent-label">--%</div>

    <script>
        const channelID = 3010841;
        const readAPI = "I4AJDEJIXTPAUIFK";

        // Set your total tank capacity in Liters (Change 100 to your actual max tank size)
        const maxTankVolume = 100; 

        async function fetchData() {
            try {
                const url = `https://thingspeak.com{channelID}/feeds.json?api_key=${readAPI}&results=1`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.feeds || data.feeds.length === 0) {
                    console.error("No feeds found in ThingSpeak response");
                    return;
                }
                
                const feed = data.feeds[0];

                // Auto-Detecting System: Scans fields 1-8 to find which field holds your actual data
                let activeValue = null;
                for (let i = 1; i <= 8; i++) {
                    let fieldValue = feed[`field${i}`];
                    if (fieldValue !== undefined && fieldValue !== null && fieldValue.trim() !== "") {
                        let parsed = parseFloat(fieldValue);
                        if (!isNaN(parsed) && parsed > 0) {
                            activeValue = parsed;
                            break; // Stop scanning once we find a valid sensor number
                        }
                    }
                }

                // If no field has data, default to 0
                const sensorVal = activeValue !== null ? activeValue : 0;

                // Formulate dashboard displays based on the found value
                const volume = sensorVal.toFixed(1);
                const height = (sensorVal * 0.5).toFixed(1); 
                const pressure = (sensorVal * 1.2).toFixed(1); 

                // Compute clear fill parameters relative to your max capacity 
                const rawFill = (sensorVal / maxTankVolume) * 100;
                const clampedFill = Math.max(0, Math.min(100, rawFill));
                const fill = clampedFill.toFixed(1);

                // Update UI elements safely
                document.getElementById('pressure').textContent = pressure;
                document.getElementById('height').textContent = height;
                document.getElementById('volume').textContent = volume;
                document.getElementById('fill').textContent = fill;

                if (clampedFill >= 95) {
                    beep();
                }

                // Setup system time tracking safely
                let formattedTime = "Unknown Time";
                if (feed.created_at) {
                    const originalTime = new Date(feed.created_at);
                    const options = {
                        day: 'numeric', month: 'long', year: 'numeric',
                        hour: '2-digit', minute: '2-digit', hour12: true
                    };
                    formattedTime = originalTime.toLocaleString('en-GB', options);
                }
                document.getElementById('timestamp').textContent = "Last updated: " + formattedTime;

                // Move visual graphics elements
                const waterElement = document.getElementById('water-level');
                const percentLabel = document.getElementById('percent-label');
                waterElement.style.height = fill + "%";
                percentLabel.textContent = fill + "%";

            } catch (err) {
                console.error("Failed to fetch ThingSpeak data:", err);
            }
        }

        function beep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.type = "square";
            oscillator.frequency.setValueAtTime(1000, ctx.currentTime); 
            gainNode.gain.setValueAtTime(1, ctx.currentTime); 

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start();
            oscillator.stop(ctx.currentTime + 0.3); 
        }

        fetchData();
        setInterval(fetchData, 1000);
    </script>

</body>
</html>
