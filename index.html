<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏠 Home Water Tank Level Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #0066cc;
        }

        .data-box {
            background: white;
            padding: 20px;
            margin: 15px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            max-width: 500px;
        }

        .label {
            font-weight: bold;
        }

        .tank {
            position: relative;
            width: 150px;
            height: 300px;
            margin: 20px auto;
            border: 3px solid #333;
            border-radius: 10px;
            background-color: #e6e6e6;
            overflow: hidden;
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #00aaff;
            transition: height 1s;
        }

        .percentage {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .updated {
            font-size: 12px;
            color: #777;
        }

        .error-msg {
            color: red;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🏠 Home Water Tank Monitor</h1>

    <div class="data-box">
        <div><span class="label">Pressure:</span> <span id="pressure">--</span> mbar</div>
        <div><span class="label">Water Height:</span> <span id="height">--</span> in</div>
        <div><span class="label">Water Volume:</span> <span id="volume">--</span> Ltr</div>
        <div><span class="label">Fill Percentage:</span> <span id="fill">--</span> %</div>
        <div class="updated" id="timestamp">Last updated: --</div>
        <div id="error-log" class="error-msg">Connecting to ThingSpeak...</div>
    </div>

    <div class="tank">
        <div class="water" id="water-level" style="height: 0%;"></div>
    </div>

    <div class="percentage" id="percent-label">--%</div>

    <script>
        // Replace these with your verified keys from ThingSpeak Account Panel
        const channelID = 3010841;
        const readAPI = "I4AJDEJIXTPAUIFK";

        // Set your total tank capacity in Liters
        const maxTankVolume = 100; 

        async function fetchData() {
            const errorElement = document.getElementById('error-log');
            try {
                const url = `https://thingspeak.com{channelID}/feeds.json?api_key=${readAPI}&results=1`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP network error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // ThingSpeak returns -1 if access is denied or incorrect
                if (data === -1) {
                    errorElement.textContent = "❌ ThingSpeak Error: -1. Check if your API Key is correct or if Channel Sharing is set to Public!";
                    return;
                }

                if (!data.feeds || data.feeds.length === 0) {
                    errorElement.textContent = "⚠️ Connected, but your hardware hasn't uploaded any data feeds yet.";
                    return;
                }
                
                // Connection is perfect, clear errors
                errorElement.textContent = ""; 
                const feed = data.feeds[0]; 

                // Process data from field6
                const rawVolume = feed.field6 ? parseFloat(feed.field6) : 0;
                const volumeVal = isNaN(rawVolume) ? 0 : rawVolume;

                // Compute parameters
                const volume = volumeVal.toFixed(1);
                const height = (volumeVal * 0.5).toFixed(1); 
                const pressure = (volumeVal * 1.2).toFixed(1); 

                const rawFill = (volumeVal / maxTankVolume) * 100;
                const clampedFill = Math.max(0, Math.min(100, rawFill));
                const fill = clampedFill.toFixed(1);

                // Safe UI display mapping
                document.getElementById('pressure').textContent = pressure;
                document.getElementById('height').textContent = height;
                document.getElementById('volume').textContent = volume;
                document.getElementById('fill').textContent = fill;

                if (clampedFill >= 95) {
                    beep();
                }

                // Parse upload clock safely
                let formattedTime = "Unknown Time";
                if (feed.created_at) {
                    const originalTime = new Date(feed.created_at);
                    const options = {
                        day: 'numeric', month: 'long', year: 'numeric',
                        hour: '2-digit', minute: '2-digit', hour12: true
                    };
                    formattedTime = originalTime.toLocaleString('en-GB', options);
                }
                document.getElementById('timestamp').textContent = "Last updated: " + formattedTime;

                // Animate canvas interface
                const waterElement = document.getElementById('water-level');
                const percentLabel = document.getElementById('percent-label');
                waterElement.style.height = fill + "%";
                percentLabel.textContent = fill + "%";

            } catch (err) {
                errorElement.textContent = "❌ Network Error: Cannot connect to ThingSpeak server.";
                console.error("Fetch failed:", err);
            }
        }

        function beep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.type = "square";
            oscillator.frequency.setValueAtTime(1000, ctx.currentTime); 
            gainNode.gain.setValueAtTime(1, ctx.currentTime); 

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.start();
            oscillator.stop(ctx.currentTime + 0.3); 
        }

        // Run fetch routines
        fetchData();
        setInterval(fetchData, 5000); // Changed to 5 seconds to comply with ThingSpeak rate limits
    </script>

</body>
</html>
